<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Gabriel Barreto research software portfolio</title>
  <desc id="description">Research software for better evidence synthesis, featuring JARVIS, CEREBRO, and TranslaTHOR.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081527"/>
      <stop offset="0.55" stop-color="#10243a"/>
      <stop offset="1" stop-color="#0a3440"/>
    </linearGradient>
    <radialGradient id="glow-cyan">
      <stop offset="0" stop-color="#42d8df" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#42d8df" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-lime">
      <stop offset="0" stop-color="#b9e865" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#b9e865" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1125" cy="60" r="360" fill="url(#glow-cyan)"/>
  <circle cx="330" cy="650" r="330" fill="url(#glow-lime)"/>

  <g transform="translate(72 62)">
    <rect width="46" height="46" rx="14" fill="#42d8df"/>
    <path d="M14 30V20.5L23 15l9 5.5V30l-9 5.5z" fill="none" stroke="#081527" stroke-width="2.7" stroke-linejoin="round"/>
    <circle cx="23" cy="25" r="3.5" fill="#081527"/>
    <text x="62" y="20" fill="#d9f6f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700" letter-spacing="1.7">GABRIEL BARRETO, PhD</text>
    <text x="62" y="43" fill="#91aabd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">Evidence synthesis · Research software · Applied AI</text>
  </g>

  <g transform="translate(72 176)">
    <text fill="#f5fbff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="58" font-weight="760" letter-spacing="-1.8">
      <tspan x="0" y="0">Research software for</tspan>
      <tspan x="0" y="68">better evidence synthesis.</tspan>
    </text>
    <text x="2" y="172" fill="#b6c9d6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22">
      Practical, transparent tools for systematic-review workflows.
    </text>
  </g>

  <g transform="translate(72 446)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g filter="url(#shadow)">
      <rect width="342" height="120" rx="22" fill="#122b42" stroke="#42d8df" stroke-opacity="0.42"/>
      <circle cx="39" cy="39" r="16" fill="#42d8df"/>
      <path d="M32 39h14M39 32v14" stroke="#081527" stroke-width="2.5" stroke-linecap="round"/>
      <text x="67" y="45" fill="#f5fbff" font-size="23" font-weight="750">JARVIS</text>
      <text x="26" y="84" fill="#9fc0d3" font-size="16">Screening &amp; prioritisation</text>
    </g>

    <g transform="translate(368 0)" filter="url(#shadow)">
      <rect width="342" height="120" rx="22" fill="#122b42" stroke="#b9e865" stroke-opacity="0.42"/>
      <circle cx="39" cy="39" r="16" fill="#b9e865"/>
      <path d="M32 35h14M32 39h14M32 43h10" stroke="#10243a" stroke-width="2.5" stroke-linecap="round"/>
      <text x="67" y="45" fill="#f5fbff" font-size="23" font-weight="750">CEREBRO</text>
      <text x="26" y="84" fill="#9fc0d3" font-size="16">Structured data extraction</text>
    </g>

    <g transform="translate(736 0)" filter="url(#shadow)">
      <rect width="400" height="120" rx="22" fill="#122b42" stroke="#ffb86b" stroke-opacity="0.42"/>
      <circle cx="39" cy="39" r="16" fill="#ffb86b"/>
      <path d="M31 38h16M40 31l7 7-7 7" fill="none" stroke="#10243a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="67" y="45" fill="#f5fbff" font-size="23" font-weight="750">TranslaTHOR</text>
      <text x="26" y="84" fill="#9fc0d3" font-size="16">Local PDF translation</text>
    </g>
  </g>

  <g transform="translate(1094 78)" opacity="0.9">
    <path d="M0 116C31 116 39 82 68 82s37 34 68 34" fill="none" stroke="#42d8df" stroke-width="2"/>
    <circle cx="0" cy="116" r="8" fill="#42d8df"/>
    <circle cx="68" cy="82" r="8" fill="#b9e865"/>
    <circle cx="136" cy="116" r="8" fill="#ffb86b"/>
  </g>
</svg>
